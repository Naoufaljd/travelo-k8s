apiVersion: v1
kind: Pod
metadata:
  name: pod-trop-gros
  namespace: travelo
spec:
  containers:
    - name: gros
      image: busybox:1.37
      command: ["sleep", "300"]
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: "2"
          memory: 4Gi