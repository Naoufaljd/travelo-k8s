apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelo-frontend
  labels:
    app.kubernetes.io/name: travelo-frontend
    app.kubernetes.io/part-of: travelo
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: travelo-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: travelo-frontend
        app.kubernetes.io/part-of: travelo
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: BACKEND_HOST
              valueFrom:
                configMapKeyRef:
                  name: travelo-config
                  key: BACKEND_HOST
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3    
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: travelo-frontend
  labels:
    app.kubernetes.io/name: travelo-frontend
    app.kubernetes.io/part-of: travelo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: travelo-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
