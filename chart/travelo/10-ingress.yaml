apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travelo-ingress
  labels:
    app.kubernetes.io/part-of: travelo
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: travelo-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: travelo-frontend
                port:
                  number: 80
