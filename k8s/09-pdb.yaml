apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: travelo-backend-pdb
  namespace: travelo
  labels:
    app.kubernetes.io/part-of: travelo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: travelo-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: travelo-frontend-pdb
  namespace: travelo
  labels:
    app.kubernetes.io/part-of: travelo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: travelo-frontend