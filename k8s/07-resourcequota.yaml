apiVersion: v1
kind: ResourceQuota
metadata:
  name: travelo-quota
  namespace: travelo
  labels:
    app.kubernetes.io/part-of: travelo
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "5"
    limits.memory: 4Gi
    pods: "20"
    services: "10"
    persistentvolumeclaims: "4"
    requests.storage: 5Gi