apiVersion: v1
kind: LimitRange
metadata:
  name: travelo-limits
  namespace: travelo
  labels:
    app.kubernetes.io/part-of: travelo
spec:
  limits:
    - type: Container
      default:                 # limites appliquées si le conteneur n'en déclare pas
        cpu: 500m
        memory: 256Mi
      defaultRequest:          # requests appliquées si le conteneur n'en déclare pas
        cpu: 100m
        memory: 64Mi
      min:
        cpu: 10m
        memory: 8Mi
      max:
        cpu: "1"
        memory: 1Gi
    - type: Pod
      max:                     # somme des conteneurs d'un même pod
        cpu: "2"
        memory: 2Gi