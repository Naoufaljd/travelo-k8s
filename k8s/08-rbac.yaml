apiVersion: v1
kind: ServiceAccount
metadata:
  name: travelo-viewer
  namespace: travelo
  labels:
    app.kubernetes.io/part-of: travelo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: travelo-reader
  namespace: travelo
  labels:
    app.kubernetes.io/part-of: travelo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "persistentvolumeclaims", "events", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: travelo-reader-binding
  namespace: travelo
  labels:
    app.kubernetes.io/part-of: travelo
subjects:
  - kind: ServiceAccount
    name: travelo-viewer
    namespace: travelo
roleRef:
  kind: Role
  name: travelo-reader
  apiGroup: rbac.authorization.k8s.io